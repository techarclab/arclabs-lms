packages:
  - 'apps/*'
  - 'packages/*'
# Dependencies allowed to run install scripts (pnpm 12 blocks them by default)
allowBuilds:
  '@firebase/util': false
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false # telemetry
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5
