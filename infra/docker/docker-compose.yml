# Local development services for ARC LABS LMS.
# Start: pnpm infra:up   Stop: pnpm infra:down
name: arc-lms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc_dev_password
      POSTGRES_DB: arc_lms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arc -d arc_lms']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (replaces MinIO, whose images were removed from Docker Hub).
  # The API creates the bucket on startup in development.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: arc_s3_key
      AWS_SECRET_ACCESS_KEY: arc_s3_secret
    ports:
      - '8333:8333' # S3 API
      - '8888:8888' # file browser -> http://localhost:8888
    volumes:
      - s3data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # inbox UI -> http://localhost:8025

volumes:
  pgdata:
  s3data:
